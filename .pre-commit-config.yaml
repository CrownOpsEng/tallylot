repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: commit-message
        name: commit-message
        entry: uv run python -m tools.validate_commit_message
        language: system
        stages: [commit-msg]
