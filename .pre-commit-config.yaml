repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
  - repo: local
    hooks:
      - id: commit-message
        name: commit-message
        entry: uv run python -m tools.validate_commit_message
        language: system
        stages: [commit-msg]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest-fast
        entry: uv run pytest -m "unit and not slow" --no-cov -q
        language: system
        pass_filenames: false
