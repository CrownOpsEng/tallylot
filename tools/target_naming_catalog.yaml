    basis:
      - document_support
      - reported_support
      - reconciled_continuity
      - adopted_opening
      - manual_support
    claim_bundle_decision_basis:
      - single_bundle
      - insufficient_identity
      - insufficient_temporal_precision
      - conflicting_claims
      - upstream_gap
      - policy_decision_required
      - later_bundle_selected
    support_shape:
      - document_observation
      - reported_observation
      - location_observation
      - inventory_observation
      - manual_assertion
