    values:
      basis:
        - document_support
        - reported_support
        - reconciled_continuity
        - adopted_opening
        - manual_support
      support_shape:
        - document_observation
        - reported_observation
        - location_observation
        - inventory_observation
        - manual_assertion
      continuity_kind:
        - observed_continuity
        - reconciled_rollforward
        - opening_rollforward
        - partial_rollforward
      balance_target_observation_status:
        - observed
        - unobserved
      balance_target_comparison_outcome:
        - matched
        - mismatched
      continuity_segment_status:
        - complete
        - partial
      checkpoint_proposal_status:
        - ready
        - partial
        - blocked
      journal_entry_status:
        - expanded
        - blocked
      entry_check_status:
        - passed
        - blocked
      tax_output_status:
        - ready
        - partial
      valuation_purpose:
        - economic_measurement
        - checkpoint_measurement
        - journal_measurement
        - tax_measurement
        - market_measurement
      origin_kind:
        - claim
        - evidence_observation
        - market_reference
        - economic_leg
        - checkpoint_assertion
        - basis_adjustment
    paired_axes:
      - [basis, support_shape, continuity_kind]
    checks:
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: basis
        label: CheckpointAssertionRecord.basis
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: support_shape
        label: CheckpointAssertionRecord.support_shape
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: continuity_kind
        label: continuity_kind
        block_type: nested_list
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: basis
        label: basis
        block_type: nested_list
        expected_values:
          - document_support
          - reconciled_continuity
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: support_shape
        label: support_shape
        block_type: nested_list
        expected_values:
          - document_observation
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: continuity_kind
        label: continuity_kind
        block_type: nested_list
        expected_values:
          - observed_continuity
          - reconciled_rollforward
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: continuity_segment_status
        label: ContinuitySegmentRecord.status
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: balance_target_observation_status
        label: BalanceTargetRecord.observation_status
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: balance_target_comparison_outcome
        label: BalanceTargetRecord.comparison_outcome
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: checkpoint_proposal_status
        label: CheckpointProposalRecord.status
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: journal_entry_status
        label: JournalEntryRecord.status
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: entry_check_status
        label: EntryCheckRecord.status
        block_type: nested_list
      - path: docs/concepts/pipeline-stage-contracts.md
        vocabulary: tax_output_status
        label: TaxOutputRecord.status
        block_type: nested_list
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: continuity_segment_status
        label: ContinuitySegmentRecord.status
        block_type: nested_list
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: balance_target_observation_status
        label: BalanceTargetRecord.observation_status
        block_type: nested_list
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: balance_target_comparison_outcome
        label: BalanceTargetRecord.comparison_outcome
        block_type: nested_list
      - path: docs/reference/first-downstream-slice-contract.md
        vocabulary: checkpoint_proposal_status
        label: CheckpointProposalRecord.status
        block_type: nested_list
      - path: docs/concepts/domain-ontology.md
        vocabulary: valuation_purpose
        label: ValuationPurpose
        block_type: heading_shared_vocabulary
