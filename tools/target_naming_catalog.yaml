    - term: support_kind
      replacement: support_shape
      finding_class: support-axis-collision
      summary_only: false
      paths:
        - docs/concepts/pipeline-stage-contracts.md
        - docs/reference/first-downstream-slice-contract.md
        - docs/standards/engineering.md
        - ROADMAP.md
      path_prefixes: []
    - term: pending_check
      replacement: expanded
      finding_class: mixed-status-axis
      summary_only: false
      paths:
        - docs/concepts/pipeline-stage-contracts.md
        - docs/standards/engineering.md
      path_prefixes: []
    - term: checked
      replacement: expanded or passed
      finding_class: mixed-status-axis
      summary_only: false
      paths:
        - docs/concepts/pipeline-stage-contracts.md
      path_prefixes: []
    - term: missing_observation
      replacement: observation_status = unobserved
      finding_class: mixed-status-axis
      summary_only: false
      paths:
        - docs/concepts/pipeline-stage-contracts.md
      path_prefixes: []
    - term: market_reference
      replacement: market_measurement
      finding_class: purpose-axis-mix
      summary_only: false
      paths:
        - docs/concepts/domain-ontology.md
      path_prefixes: []
    - term: BalanceTargetRecord.status
      replacement: BalanceTargetRecord.observation_status and BalanceTargetRecord.comparison_outcome
      finding_class: mixed-status-axis
      summary_only: false
      paths:
        - docs/concepts/pipeline-stage-contracts.md
        - docs/reference/first-downstream-slice-contract.md
      path_prefixes: []
