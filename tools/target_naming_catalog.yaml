matrix_specs:
  - path: docs/concepts/bridge-to-target-mapping.md
    required_columns:
      - Current bridge surface
      - Target authoritative product(s)
      - Derived compatibility view
      - Derived compatibility sidecar
      - Current readers
      - Target readers after cutover
      - Cutover gate
      - Retirement gate
    allowed_shape_nouns:
      - compatibility view
      - compatibility sidecar
      - none
    banned_fragments:
      - view or sidecar
      - optional planner review view
      - planning sidecar
      - statement-facing compatibility sidecar
      - recognized statement parse outputs and balance rows
      - source translation boundary
      - current bridge balance reducers
      - current bridge balance-reference path
      - bridge/output compatibility sidecars
      - target products
      - target product plus shared gap/review/readiness records
      - issue compatibility view
      - review compatibility view

exceptions:
  - exception_id: locality.bridge_fields
    allowed_scopes: [forward_target, repo_policy]
    allowed_paths:
      - docs/concepts/pipeline-stage-contracts.md
      - docs/reference/first-upstream-slice-contract.md
      - docs/reference/target-ids-and-refs.md
      - docs/concepts/bridge-to-target-mapping.md
      - docs/standards/engineering.md
    allowed_section_labels: []
    allowed_terms:
      - source_slug
      - activity_label
      - provider_operation_key
      - accounting_intent_hint
      - projection_hint
      - tax_treatment_hint
      - tx_hash_or_null
      - operation_group_id_or_null
    required_marker: Locality rule
    required_rationale: true
    notes: Bridge and evidence-local compatibility fields must be restated where they appear.
  - exception_id: locality.origin_kind_market_reference
    allowed_scopes: [forward_target, repo_policy]
    allowed_paths:
      - docs/reference/target-ids-and-refs.md
    allowed_section_labels: []
    allowed_terms:
      - market_reference
    required_marker: Locality rule
    required_rationale: true
    notes: OriginRef keeps market_reference on the origin axis only.
  - exception_id: example.provider_slice_terms
    allowed_scopes: [forward_target]
    allowed_paths:
      - docs/reference/first-upstream-slice-contract.md
      - docs/reference/first-downstream-slice-contract.md
    allowed_section_labels: []
    allowed_terms:
      - Coinbase
      - custodial
    required_marker: Slice-only example
    required_rationale: true
    notes: Provider and custody terms are slice-bounded examples only.
  - exception_id: locality.current_runtime_cointracking
    allowed_scopes: [forward_target, repo_policy]
    allowed_paths:
      - AGENTS.md
      - ROADMAP.md
      - docs/README.md
      - docs/concepts/domain-ontology.md
      - docs/concepts/oracle-boundaries.md
      - docs/concepts/reconciliation-tax-architecture.md
      - docs/status/adapter-delivery-plan.md
      - docs/standards/engineering.md
      - docs/standards/implementation.md
    allowed_section_labels: []
    allowed_terms:
      - CoinTracking
    required_marker: Current runtime note
    required_rationale: true
    notes: CoinTracking remains current-state or oracle-local truth only.
  - exception_id: locality.assessment_root
    allowed_scopes: [forward_target, repo_policy]
    allowed_paths:
      - ROADMAP.md
      - docs/concepts/domain-ontology.md
      - docs/concepts/reconciliation-tax-architecture.md
      - docs/reference/target-persistence-reference.md
      - docs/standards/engineering.md
    allowed_section_labels: []
    allowed_terms:
      - assessment/
      - domain/assessment/
    required_marker: Exception rationale
    required_rationale: true
    notes: Shared assessment roots are allowed only with explicit rationale.
  - exception_id: locality.compatibility_root
    allowed_scopes: [forward_target, repo_policy]
    allowed_paths:
      - docs/concepts/domain-ontology.md
      - docs/standards/engineering.md
    allowed_section_labels: []
    allowed_terms:
      - application/compatibility/
    required_marker: Migration-only root rationale
    required_rationale: true
    notes: application/compatibility is migration-only and must be labeled as such.
  - exception_id: locality.source_provider_crypto_terms
    allowed_scopes: [forward_target]
    allowed_paths:
      - ROADMAP.md
      - docs/README.md
      - docs/concepts/domain-ontology.md
      - docs/concepts/oracle-boundaries.md
      - docs/reference/first-upstream-slice-contract.md
    allowed_section_labels: []
    allowed_terms:
      - wallet
      - exchange
      - address
      - tx_hash
      - crypto
    required_rationale: false
    notes: Source- or crypto-specific terms stay confined to declared bounded exceptions.
  - exception_id: locality.compatibility_bridge_surfaces
    allowed_scopes: [forward_target, repo_policy]
    allowed_paths:
      - docs/concepts/bridge-to-target-mapping.md
      - docs/concepts/gaps-and-readiness.md
    allowed_section_labels: []
    allowed_terms:
      - IssueRecord
      - NormalizationReviewRecord
      - exceptions.csv
      - normalization_reviews.csv
      - fact_annotations.json
      - location_annotations.json
    required_marker: Compatibility-only locality
    required_rationale: true
    notes: Bridge-only diagnostic records and retained files must stay fenced as compatibility-local surfaces.

required_markers:
  - Slice-only example
  - Compatibility-only locality
  - Current runtime note
  - Anti-example
  - Exception rationale
  - Migration-only root rationale
  - Locality rule
