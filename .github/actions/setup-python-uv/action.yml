name: Setup Python and uv
description: Setup Python 3.12, restore the uv cache, and sync repo dependencies.

inputs:
  include-ci-group:
    description: Include CI-only dependency tooling during sync.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      with:
        version: "0.9.20"
        enable-cache: true
    - name: Export repo project environment
      shell: bash
      run: |
        PROJECT_ENVIRONMENT="$HOME/.venvs/tallylot-py312"
        echo "UV_PROJECT_ENVIRONMENT=$PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
        echo "$PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
    - name: Sync dependencies
      shell: bash
      run: |
        SYNC_ARGS=(--python 3.12 --frozen)
        if [ "${{ inputs.include-ci-group }}" != "true" ]; then
          SYNC_ARGS+=(--no-group ci)
        fi
        uv sync "${SYNC_ARGS[@]}"
    - name: Prune uv cache
      shell: bash
      run: uv cache prune --ci
