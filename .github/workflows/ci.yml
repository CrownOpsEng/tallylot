name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --python 3.12 --frozen
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$CURRENT_SHA^!"
          else
            RANGE="$BEFORE_SHA..$CURRENT_SHA"
          fi
          uv run python -m tools.validate_commit_message --rev-range "$RANGE"
      - name: Validate PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run python -m tools.validate_pr_metadata --title "$PR_TITLE" --body "$PR_BODY"

  quality:
    needs: commit-messages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --python 3.12 --frozen
      - name: Markdownlint
        run: uv run pre-commit run markdownlint --all-files
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pyright
        run: uv run pyright
      - name: Pylint
        run: uv run pylint src tests tools
      - name: Pytest
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Verify built wheel entry point
        run: |
          set -eu
          rm -rf /tmp/tallylot-wheel-test
          python3.12 -m venv /tmp/tallylot-wheel-test
          /tmp/tallylot-wheel-test/bin/pip install dist/*.whl
          /tmp/tallylot-wheel-test/bin/tallylot --help >/dev/null
