[project]
name = "crypto-reconciliation"
version = "0.1.0"
description = "Typed crypto ledger reconciliation tooling with an external workspace architecture."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Chris Wright" },
]
keywords = ["crypto", "ledger", "reconciliation", "finance", "tax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11.0,<3.0.0",
    "pypdf>=5.4.0,<6.0.0",
    "typer>=0.15.2,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "pylint>=3.3.6,<4.0.0",
    "pyright>=1.1.399,<2.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "reportlab>=4.4.0,<5.0.0",
    "ruff>=0.11.2,<0.12.0",
]

[project.scripts]
crypto-reconciliation = "crypto_reconciliation.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_reconciliation"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=crypto_reconciliation",
    "--cov-report=term-missing",
    "-ra",
]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end CLI and service coverage.",
    "contract: adapter and output contract coverage.",
]

[tool.coverage.run]
branch = true
source = ["src/crypto_reconciliation"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv]
default-groups = ["dev"]
